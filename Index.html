<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Scoreboard</title>

    <style>
        :root {
            --crimson: #B31B34;
            --dark-crimson: #7D1224;
            --black: #111111;
            --dark-gray: #222222;
            --gray: #444444;
            --light-gray: #E8E8E8;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
        }

        /* =========================
           SETUP SCREEN
        ========================= */

        .header {
            background: var(--crimson);
            text-align: center;
            padding: 25px 10px;
        }

        .header h1 {
            margin: 0 0 5px;
            font-size: 34px;
        }

        .header h2 {
            margin: 0;
            font-size: 13px;
        }

        .setup-container {
            text-align: center;
            padding: 35px 20px;
        }

        .player-inputs {
            display: flex;
            justify-content: center;
            gap: 70px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="number"] {
            font-size: 20px;
            text-align: center;
            padding: 10px;
            border: none;
            outline: none;
            background: var(--white);
            color: var(--black);
        }

        input[type="text"] {
            width: 260px;
        }

        input[type="number"] {
            width: 120px;
        }

        .setup-label {
            font-size: 16px;
            font-weight: bold;
            margin: 25px 0 8px;
        }

        .breaker-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 10px;
        }

        .breaker-options label {
            font-size: 14px;
            cursor: pointer;
        }

        .breaker-options input {
            accent-color: var(--crimson);
        }

        button {
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .start-button {
            background: var(--crimson);
            color: var(--white);
            font-size: 18px;
            padding: 15px 50px;
            margin-top: 30px;
        }

        .start-button:hover {
            background: var(--dark-crimson);
        }

        /* =========================
           SCOREBOARD
        ========================= */

        #scoreboard-screen {
            display: none;
            min-height: 100vh;
            position: relative;
            padding-bottom: 85px;
        }

        .score-header {
            background: var(--crimson);
            text-align: center;
            padding: 20px 10px;
        }

        .score-header h1 {
            margin: 0 0 2px;
            font-size: 32px;
        }

        .score-header h2 {
            margin: 0;
            font-size: 15px;
        }

        .breaker-bar {
            background: var(--dark-gray);
            text-align: center;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .score-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-top: 35px;
        }

        .player-panel {
            width: 320px;
            height: 350px;
            background: var(--white);
            border: 3px solid var(--crimson);
            color: var(--black);
            text-align: center;
            padding-top: 18px;
        }

        .player-name {
            font-size: 22px;
            font-weight: bold;
        }

        .score {
            font-size: 95px;
            font-weight: bold;
            color: var(--crimson);
            line-height: 1.1;
            margin-top: 5px;
        }

        .score-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .add-button,
        .remove-button {
            width: 90px;
            height: 55px;
            font-size: 22px;
        }

        .add-button {
            background: var(--crimson);
            color: var(--white);
        }

        .add-button:hover {
            background: var(--dark-crimson);
        }

        .remove-button {
            background: var(--light-gray);
            color: var(--black);
        }

        .remove-button:hover {
            background: var(--gray);
            color: var(--white);
        }

        .vs {
            font-size: 22px;
            font-weight: bold;
            color: var(--crimson);
        }

        /* =========================
           BOTTOM BAR
        ========================= */

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--dark-gray);
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
        }

        .reset-button {
            background: var(--gray);
            color: var(--white);
            font-size: 13px;
            padding: 10px 25px;
        }

        .reset-button:hover {
            background: var(--crimson);
        }

        .new-match-button {
            background: var(--crimson);
            color: var(--white);
            font-size: 13px;
            padding: 10px 25px;
        }

        .new-match-button:hover {
            background: var(--dark-crimson);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .header h1,
            .score-header h1 {
                font-size: 26px;
            }

            .player-inputs {
                flex-direction: column;
                gap: 20px;
            }

            .score-area {
                flex-direction: column;
                gap: 15px;
            }

            .player-panel {
                width: 90%;
                max-width: 320px;
            }

            .vs {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         SETUP SCREEN
    ========================== -->

    <div id="setup-screen">

        <div class="header">
            <h1>POOL SCOREBOARD</h1>
            <h2>MATCH SETUP</h2>
        </div>

        <div class="setup-container">

            <div class="player-inputs">

                <div class="input-group">
                    <label for="player1">PLAYER 1</label>
                    <input
                        type="text"
                        id="player1"
                        placeholder="Player 1"
                    >
                </div>

                <div class="input-group">
                    <label for="player2">PLAYER 2</label>
                    <input
                        type="text"
                        id="player2"
                        placeholder="Player 2"
                    >
                </div>

            </div>

            <div class="setup-label">
                RACE TO
            </div>

            <input
                type="number"
                id="race-length"
                value="7"
                min="1"
            >

            <div class="setup-label">
                FIRST BREAK
            </div>

            <div class="breaker-options">

                <label>
                    <input
                        type="radio"
                        name="breaker"
                        value="player1"
                        checked
                    >
                    Player 1
                </label>

                <label>
                    <input
                        type="radio"
                        name="breaker"
                        value="player2"
                    >
                    Player 2
                </label>

            </div>

            <br>

            <button
                class="start-button"
                onclick="startMatch()"
            >
                START MATCH
            </button>

        </div>

    </div>


    <!-- =========================
         SCOREBOARD SCREEN
    ========================== -->

    <div id="scoreboard-screen">

        <div class="score-header">
            <h1>POOL SCOREBOARD</h1>
            <h2 id="race-display">RACE TO 7</h2>
        </div>

        <div class="breaker-bar">
            <span id="breaker-display">
                ● BREAK: Player 1
            </span>
        </div>


        <div class="score-area">

            <!-- PLAYER 1 -->

            <div class="player-panel">

                <div
                    class="player-name"
                    id="player1-name"
                >
                    PLAYER 1
                </div>

                <div
                    class="score"
                    id="score1"
                >
                    0
                </div>

                <div class="score-buttons">

                    <button
                        class="add-button"
                        onclick="addPoint(1)"
                    >
                        +1
                    </button>

                    <button
                        class="remove-button"
                        onclick="removePoint(1)"
                    >
                        −1
                    </button>

                </div>

            </div>


            <!-- VS -->

            <div class="vs">
                VS
            </div>


            <!-- PLAYER 2 -->

            <div class="player-panel">

                <div
                    class="player-name"
                    id="player2-name"
                >
                    PLAYER 2
                </div>

                <div
                    class="score"
                    id="score2"
                >
                    0
                </div>

                <div class="score-buttons">

                    <button
                        class="add-button"
                        onclick="addPoint(2)"
                    >
                        +1
                    </button>

                    <button
                        class="remove-button"
                        onclick="removePoint(2)"
                    >
                        −1
                    </button>

                </div>

            </div>

        </div>


        <!-- BOTTOM BUTTONS -->

        <div class="bottom-bar">

            <button
                class="reset-button"
                onclick="resetMatch()"
            >
                RESET SCORE
            </button>

            <button
                class="new-match-button"
                onclick="newMatch()"
            >
                NEW MATCH
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // Game variables

        let player1 = "";
        let player2 = "";

        let raceLength = 7;

        let breaker = "";

        let score1 = 0;
        let score2 = 0;


        // =========================
        // START MATCH
        // =========================

        function startMatch() {

            player1 =
                document
                .getElementById("player1")
                .value
                .trim();

            player2 =
                document
                .getElementById("player2")
                .value
                .trim();


            // Check player names

            if (!player1 || !player2) {

                alert(
                    "Please enter both player names."
                );

                return;
            }


            // Get race length

            raceLength =
                parseInt(
                    document
                    .getElementById("race-length")
                    .value
                );


            if (
                isNaN(raceLength) ||
                raceLength <= 0
            ) {

                alert(
                    "Please enter a valid race length."
                );

                return;
            }


            // Determine first breaker

            const breakerChoice =
                document.querySelector(
                    'input[name="breaker"]:checked'
                ).value;


            if (breakerChoice === "player1") {

                breaker = player1;

            } else {

                breaker = player2;

            }


            // Reset scores

            score1 = 0;
            score2 = 0;


            // Update scoreboard

            document.getElementById(
                "player1-name"
            ).textContent =
                player1.toUpperCase();


            document.getElementById(
                "player2-name"
            ).textContent =
                player2.toUpperCase();


            document.getElementById(
                "race-display"
            ).textContent =
                "RACE TO " + raceLength;


            updateScoreboard();


            // Switch screens

            document.getElementById(
                "setup-screen"
            ).style.display = "none";


            document.getElementById(
                "scoreboard-screen"
            ).style.display = "block";

        }


        // =========================
        // ADD POINT
        // =========================

        function addPoint(player) {

            // Don't allow scoring after race is complete

            if (
                score1 >= raceLength ||
                score2 >= raceLength
            ) {
                return;
            }


            // Add point

            if (player === 1) {

                score1++;

            } else {

                score2++;

            }


            // Switch breaker

            if (breaker === player1) {

                breaker = player2;

            } else {

                breaker = player1;

            }


            // Update display

            updateScoreboard();


            // Check winner

            if (score1 >= raceLength) {

                alert(
                    "🏆 " +
                    player1 +
                    " wins!\n\n" +
                    score1 +
                    " - " +
                    score2
                );

            }

            else if (score2 >= raceLength) {

                alert(
                    "🏆 " +
                    player2 +
                    " wins!\n\n" +
                    score2 +
                    " - " +
                    score1
                );

            }

        }


        // =========================
        // REMOVE POINT
        // =========================

        function removePoint(player) {

            if (player === 1) {

                if (score1 > 0) {
                    score1--;
                }

            } else {

                if (score2 > 0) {
                    score2--;
                }

            }


            updateScoreboard();

        }


        // =========================
        // UPDATE SCOREBOARD
        // =========================

        function updateScoreboard() {

            document.getElementById(
                "score1"
            ).textContent = score1;


            document.getElementById(
                "score2"
            ).textContent = score2;


            document.getElementById(
                "breaker-display"
            ).textContent =
                "● BREAK: " + breaker;

        }


        // =========================
        // RESET MATCH
        // =========================

        function resetMatch() {

            const answer =
                confirm(
                    "Reset both scores to 0?"
                );


            if (answer) {

                score1 = 0;
                score2 = 0;

                updateScoreboard();

            }

        }


        // =========================
        // NEW MATCH
        // =========================

        function newMatch() {

            document.getElementById(
                "scoreboard-screen"
            ).style.display = "none";


            document.getElementById(
                "setup-screen"
            ).style.display = "block";


            // Clear names

            document.getElementById(
                "player1"
            ).value = "";


            document.getElementById(
                "player2"
            ).value = "";


            // Reset race

            document.getElementById(
                "race-length"
            ).value = 7;


            // Reset first breaker

            document.querySelector(
                'input[value="player1"]'
            ).checked = true;

        }

    </script>

</body>
</html>
