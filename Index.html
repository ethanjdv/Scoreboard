<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Pool Scoreboard</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- =========================
     SETUP SCREEN
========================== -->

<div id="setup-screen">

    <div class="header">
        <h1>POOL SCOREBOARD</h1>
        <h2>MATCH SETUP</h2>
    </div>

    <div class="setup-container">

        <div class="player-inputs">

            <div class="input-group">
                <label for="player1">PLAYER 1</label>

                <input
                    type="text"
                    id="player1"
                    placeholder="Player 1"
                >
            </div>

            <div class="input-group">
                <label for="player2">PLAYER 2</label>

                <input
                    type="text"
                    id="player2"
                    placeholder="Player 2"
                >
            </div>

        </div>


        <div class="setup-label">
            RACE TO
        </div>

        <input
            type="number"
            id="race-length"
            value="7"
            min="1"
        >


        <div class="setup-label">
            FIRST BREAK
        </div>

        <div class="breaker-options">

            <label>
                <input
                    type="radio"
                    name="breaker"
                    value="player1"
                    checked
                >

                Player 1
            </label>

            <label>
                <input
                    type="radio"
                    name="breaker"
                    value="player2"
                >

                Player 2
            </label>

        </div>


        <button
            id="start-button"
            class="start-button"
        >
            START MATCH
        </button>

    </div>

</div>


<!-- =========================
     SCOREBOARD SCREEN
========================== -->

<div id="scoreboard-screen">

    <div class="score-header">

        <h1>POOL SCOREBOARD</h1>

        <h2 id="race-display">
            RACE TO 7
        </h2>

    </div>


    <!-- Breaker -->

    <div class="breaker-bar">

        <span id="breaker-display">
            ● BREAK: Player 1
        </span>

    </div>


    <!-- Scores -->

    <div class="score-area">

        <!-- PLAYER 1 -->

        <div class="player-panel">

            <div
                class="player-name"
                id="player1-name"
            >
                PLAYER 1
            </div>

            <div
                class="score"
                id="score1"
            >
                0
            </div>

            <div class="score-buttons">

                <button
                    id="player1-add"
                    class="add-button"
                >
                    +1
                </button>

                <button
                    id="player1-remove"
                    class="remove-button"
                >
                    −1
                </button>

            </div>

        </div>


        <!-- VS -->

        <div class="vs">
            VS
        </div>


        <!-- PLAYER 2 -->

        <div class="player-panel">

            <div
                class="player-name"
                id="player2-name"
            >
                PLAYER 2
            </div>

            <div
                class="score"
                id="score2"
            >
                0
            </div>

            <div class="score-buttons">

                <button
                    id="player2-add"
                    class="add-button"
                >
                    +1
                </button>

                <button
                    id="player2-remove"
                    class="remove-button"
                >
                    −1
                </button>

            </div>

        </div>

    </div>


    <!-- Bottom bar -->

    <div class="bottom-bar">

        <button
            id="reset-button"
            class="reset-button"
        >
            RESET SCORE
        </button>

        <button
            id="new-match-button"
            class="new-match-button"
        >
            NEW MATCH
        </button>

    </div>

</div>


<!-- JavaScript -->

<script src="script.js"></script>
```

</body>
</html>
